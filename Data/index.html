<!DOCTYPE html>
<html lang="en">
<header>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <!-- Bootstrap CSS -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-1BmE4kWBq78iYhFldvKuhfTAU6auU8tT94WrHftjDbrCEXSU1oBoqyl2QvZ6jIW3"
      crossorigin="anonymous"
    />
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-ka7Sk0Gln4gmtz2MlQnikT1wXgYsOg+OMhuP+IlRH9sENBO0LRn5q+8nbTov4+1p"
      crossorigin="anonymous"
    ></script>
    <script
      src="https://code.jquery.com/jquery-3.6.0.min.js"
      integrity="sha256-/xUj+3OJU5yExlq6GSYGSHk7tPXikynS7ogEvDej/m4="
      crossorigin="anonymous"
    ></script>
  </head>
</header>

<body>
  <div class="container-fluid">
    <!-- Add new device form -->
    <div class="row justify-content-center">
      <div class="col-xl-4 col-xs-12 mx-auto my-3">
        <form id="deviceForm" onsubmit="sendPOSTrequest(event)">
          <div class="form-group mb-2">
            <label for="deviceID">Device ID</label>
            <input type="text" class="form-control" id="deviceID" required />
            <!-- Error message for duplicate ID -->
            <div id="idError" class="text-danger small mt-1 d-none">
              This device ID already exists. Please choose another one.
            </div>
          </div>
          <div class="form-group mb-2">
            <label for="deviceName">Device name</label>
            <input type="text" class="form-control" id="deviceName" required />
          </div>
          <div class="form-group mb-2">
            <label for="measureType">Measure type</label>
            <input type="text" class="form-control" id="measureType" required />
          </div>
          <div class="form-group mb-2">
            <label for="unit">Unit</label>
            <input type="text" class="form-control" id="unit" required />
          </div>

          <button type="submit" class="btn btn-primary mt-2">Submit</button>
        </form>
      </div>
    </div>

    <!-- Device table -->
    <div class="row justify-content-center">
      <div class="col-xl-6 col-xs-12 mx-auto my-3">
        <table class="table table-bordered align-middle text-center">
          <thead class="table-light">
            <tr>
              <th>ID</th>
              <th>Device name</th>
              <th>Measure type</th>
              <th>Unit</th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody id="tableBody">
            <tr><td colspan="5">Loading devices...</td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>

  <!-- Modal for updating a device -->
  <div
    class="modal fade"
    id="updateModal"
    tabindex="-1"
    aria-labelledby="updateModalLabel"
    aria-hidden="true"
  >
    <div class="modal-dialog">
      <div class="modal-content">
        <form id="updateForm" onsubmit="submitUpdate(event)">
          <div class="modal-header">
            <h5 class="modal-title" id="updateModalLabel">Update Device</h5>
            <button
              type="button"
              class="btn-close"
              data-bs-dismiss="modal"
              aria-label="Close"
            ></button>
          </div>
          <div class="modal-body">
            <div class="form-group mb-2">
              <label for="editDeviceID">Device ID</label>
              <input
                type="text"
                class="form-control"
                id="editDeviceID"
                readonly
              />
            </div>
            <div class="form-group mb-2">
              <label for="editDeviceName">Device name</label>
              <input type="text" class="form-control" id="editDeviceName" required />
            </div>
            <div class="form-group mb-2">
              <label for="editMeasureType">Measure type</label>
              <input type="text" class="form-control" id="editMeasureType" required />
            </div>
            <div class="form-group mb-2">
              <label for="editUnit">Unit</label>
              <input type="text" class="form-control" id="editUnit" required />
            </div>
          </div>
          <div class="modal-footer">
            <button
              type="button"
              class="btn btn-secondary"
              data-bs-dismiss="modal"
            >
              Cancel
            </button>
            <button type="submit" class="btn btn-primary">Save changes</button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <script>
    $(function () {
      // Load devices on first access
      $.ajax({
        type: "GET",
        url: "/devicesList",
        contentType: "application/json",
        dataType: "json",
        success: function (response) {
          updateTable(response);
        },
        error: function (xhr, status, error) {
          console.error("Failed to load devices:", status, error);
          $("#tableBody").html(
            '<tr><td colspan="5" class="text-danger">Failed to load devices.</td></tr>'
          );
        },
      });

      // Remove red message once user starts typing again
      $("#deviceID").on("input", function () {
        $("#idError").addClass("d-none");
        $("#deviceID").removeClass("is-invalid");
      });
    });

    // POST request for new devices
    function sendPOSTrequest(event) {
      event.preventDefault();
      $("#idError").addClass("d-none");
      $("#deviceID").removeClass("is-invalid");

      const deviceData = {
        deviceID: $("#deviceID").val(),
        deviceName: $("#deviceName").val(),
        measureType: $("#measureType").val(),
        unit: $("#unit").val(),
      };

      $.ajax({
        type: "POST",
        url: "/addDevice",
        contentType: "application/json",
        data: JSON.stringify(deviceData),
        dataType: "json",
        success: function (response) {
          updateTable(response);
          $("#deviceForm")[0].reset();
        },
        error: function (xhr, status, error) {
          if (xhr.status === 409) {
            // Device ID already exists
            $("#idError").removeClass("d-none");
            $("#deviceID").addClass("is-invalid");
          } else {
            console.error("POST request failed:", status, error);
          }
        },
      });
    }

    // PUT request for updating a device
    function SendPUTrequest(deviceData) {
      $.ajax({
        type: "PUT",
        url: `/updateDevice/${deviceData.deviceID}`,
        contentType: "application/json",
        data: JSON.stringify(deviceData),
        dataType: "json",
        success: function (response) {
          $("#updateModal").modal("hide");
          updateTable(response);
        },
        error: function (xhr, status, error) {
          console.error("PUT request failed:", status, error);
        },
      });
    }

    // DELETE request
    function sendDELETErequest(deviceID) {
      if (!confirm("Are you sure you want to delete this device?")) return;
      $.ajax({
        type: "DELETE",
        url: `/deleteDevice/${deviceID}`,
        contentType: "application/json",
        dataType: "json",
        success: function (response) {
          updateTable(response);
        },
        error: function (xhr, status, error) {
          console.error("DELETE request failed:", status, error);
        },
      });
    }

    // Update table with data
    function updateTable(data) {
      let updatedTableBody = "";
      if (!data.devicesList || data.devicesList.length === 0) {
        updatedTableBody =
          '<tr><td colspan="5" class="text-muted">No devices found.</td></tr>';
      } else {
        for (let i = 0; i < data.devicesList.length; i++) {
          const device = data.devicesList[i];
          updatedTableBody += `
            <tr>
              <td>${device.deviceID}</td>
              <td>${device.deviceName}</td>
              <td>${device.measureType}</td>
              <td>${device.unit}</td>
              <td>
                <button class="btn btn-warning btn-sm me-1"
                  onclick='openEditModal(${JSON.stringify(device)})'>Update</button>
                <button class="btn btn-danger btn-sm"
                  onclick='sendDELETErequest("${device.deviceID}")'>Delete</button>
              </td>
            </tr>`;
        }
      }
      $("#tableBody").html(updatedTableBody);
    }

    // Open the modal and fill form for editing
    function openEditModal(device) {
      $("#editDeviceID").val(device.deviceID);
      $("#editDeviceName").val(device.deviceName);
      $("#editMeasureType").val(device.measureType);
      $("#editUnit").val(device.unit);
      const modal = new bootstrap.Modal(document.getElementById("updateModal"));
      modal.show();
    }

    // Handle form submission from modal
    function submitUpdate(event) {
      event.preventDefault();
      const updatedData = {
        deviceID: $("#editDeviceID").val(),
        deviceName: $("#editDeviceName").val(),
        measureType: $("#editMeasureType").val(),
        unit: $("#editUnit").val(),
      };
      SendPUTrequest(updatedData);
    }
  </script>
</body>
</html>
